<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Icons -->

    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="connexion.css">
    <title>Document</title>
</head>
<body>
    
    <header class="position-fixed w-100" style="z-index: 10;">

        <nav class="navbar navbar-expand-lg navbar-dark w-100 bg_2 shadow">
            <div class="container">
                <div class="d-flex gap-3">
                    <div class="bg_1 text-white fw-bold fs-5 p-2 rounded-5">OP</div>
                    <a class="navbar-brand text-dark fw-bold" href="#">Oumara Prestige</a>
                </div>

                <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
                    data-bs-target="#mainNav" onclick="toggleMenu()">
                    <div class="menu-btn" id="menuBtn">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </button>

                <div class="collapse navbar-collapse text-center" id="mainNav">
                    <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-lg-4">
                        <li class="nav-item"><a class="nav-link text-dark bg1_1" href="index.html">Accueil</a>
                        </li>
                        <li class="nav-item"><a class="nav-link text-dark" href="apropos.html">A propos</a></li>
                        <li class="nav-item"><a class="nav-link text-dark" href="reservation.html">Réservation</a></li>
                        <li class="nav-item"><a class="nav-link text-dark" href="contacts.html">Contact</a></li>
                    </ul>

                    <div class="fans d-flex align-items-center justify-content-center gap-3">
                        <i class="bi bi-person-fill text-white"></i>
                        <i class="bi bi-cart-fill text-white"></i>
                        <i class="bi bi-search text-white"></i>
                        <a href="connexion.html" class="btn  text-white bg_3 rounded-5 fs-7">Connexion</a>
                        <a href="inscription.html" class="btn text-white bg_1 rounded-5 fs-7">S'inscrire</a>
                    </div>
                </div>

            </div>
        </nav>

    </header>

    <main class="d-flex justify-content-center align-items-center">
        <div class="card shadow border-0 p-4 login-card1">

        <!-- Icon -->
        <div class="d-flex justify-content-center mb-3 fs-7">
            <div class="profile-icon d-flex justify-content-center align-items-center">
                <i class="bi bi-person"></i>
            </div>
        </div>

        <!-- Title -->
        <h3 class="text-center fw-bold">Creer un compte !</h3>
        <p class="text-center text-muted mb-4 fs-7">
            Connectez-vous à votre compte
        </p>

        <!-- Nom -->
        <div class="mb-3 fs-7">
            <label class="form-label fw-semibold">Nom</label>

            <input type="text"
                class="form-control p-1"
                placeholder="Votre Nom">
        </div>

        <!-- Prenom -->
        <div class="mb-3 fs-7">
            <label class="form-label fw-semibold">Prenom</label>

            <input type="text"
                class="form-control p-1"
                placeholder="Votre Prenom">
        </div>

        <!-- Email -->
        <div class="mb-3 fs-7">
            <label class="form-label fw-semibold">Email</label>

            <input type="email"
                class="form-control p-1"
                placeholder="votreemail@exemple.fr">
        </div>

        <!-- Téléphone -->
        <div class="mb-3 fs-7">
            <label class="form-label fw-semibold">Telephone</label>

            <input type="email"
                class="form-control p-1"
                placeholder="+336 12 34 56 78">
        </div>

        <!-- Password -->
        <div class="mb-3 fs-7">
            <label class="form-label fw-semibold">
                Mot de passe
            </label>

            <input type="password"
                class="form-control p-1"
                placeholder="********">
        </div>

        <!-- Confirm Password -->
        <div class="mb-3 fs-7">
            <label class="form-label fw-semibold">
               Confirmer le mot de passe
            </label>

            <input type="password"
                class="form-control p-1"
                placeholder="********">
        </div>

        <!-- Remember -->
        <div class="d-flex justify-content-between align-items-center mb-4 fs-7">

            <div class="form-check">
                <input class="form-check-input" type="checkbox">

                <label class="form-check-label">
                    J'accepte les <a href="#" class="signup-link">
                conditions d'utilisations</a> et la <a href="#" class="signup-link">politique de confidentialité</a>
                </label>
            </div>

            
        </div>

        <!-- Button -->
        <button class="btn btn-login w-100 p-1 fw-semibold fs-7">
            S'inscrire
        </button>

        <!-- Divider -->
        <!-- <div class="divider my-4">OU</div> -->

        <!-- Google -->
        <!-- <button class="btn social-btn w-100 p-3 mb-3">
            <i class="bi bi-google"></i>
            Continuer avec Google
        </button> -->

        <!-- Facebook -->
        <!-- <button class="btn social-btn w-100 p-3">
            <i class="bi bi-facebook text-primary"></i>
            Continuer avec Facebook
        </button> -->

        <!-- Signup -->
        <p class="text-center mt-4 mb-0 fs-7">
            Vous avez déja un compte ?
            <a href="#" class="signup-link">
                Se connecter
            </a>
        </p>

    </div>

    </main>
</body>
</html>
